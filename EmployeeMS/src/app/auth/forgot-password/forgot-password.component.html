<div class="auth-page-container">
  <div class="staff-card auth-card">
    <!-- Brand Header -->
    <div class="auth-brand-header">
      <div class="brand-logo-badge">
        <svg class="staffsphere-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" fill="#0D1F36" stroke="#2563EB" stroke-width="2.5"/>
          <circle cx="50" cy="50" r="32" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="3 3"/>
          <path d="M 50 34 A 20 20 0 0 1 70 54" stroke="#2563EB" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M 68 66 A 20 20 0 0 1 32 66" stroke="#14B8A6" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M 30 54 A 20 20 0 0 1 50 34" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" fill="none"/>
          <circle cx="50" cy="24" r="6.5" fill="#2563EB"/>
          <path d="M41 42 C41 33, 59 33, 59 42 C59 47, 54 48, 50 49 C46 48, 41 47, 41 42 Z" fill="#2563EB"/>
          <circle cx="70" cy="58" r="6.5" fill="#14B8A6"/>
          <path d="M59 72 C64 65, 80 71, 77 79 C74 83, 67 82, 63 80 C60 77, 58 74, 59 72 Z" fill="#14B8A6"/>
          <circle cx="30" cy="58" r="6.5" fill="#8B5CF6"/>
          <path d="M41 72 C36 65, 20 71, 23 79 C26 83, 33 82, 37 80 C40 77, 42 74, 41 72 Z" fill="#8B5CF6"/>
        </svg>
      </div>
      <h1 class="brand-title">StaffSphere</h1>
      <p class="brand-tagline">Empowering People. Simplifying Work.</p>
    </div>

    <div class="auth-subheading">
      <h2 class="auth-title">Password Recovery</h2>
      <p class="auth-desc">Enter your email to receive a password reset link</p>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-field-group">
        <label for="email" class="field-label">Email Address</label>
        <div class="input-with-icon">
          <i class="bi bi-envelope field-icon"></i>
          <input 
            type="email" 
            id="email" 
            formControlName="email"
            class="custom-input"
            placeholder="Enter your registered email"
            [class.is-invalid]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
        </div>
        <div class="invalid-feedback" *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
          <span *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Please enter a valid email address</span>
        </div>
      </div>

      <div class="auth-alert-danger" *ngIf="errorMessage">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="auth-alert-success" *ngIf="successMessage">
        <i class="bi bi-check-circle-fill"></i>
        <span>{{ successMessage }}</span>
      </div>

      <div class="loading-pill" *ngIf="loading">
        <span class="spinner-border spinner-border-sm text-primary"></span>
        <span>Sending secure reset link...</span>
      </div>

      <button type="submit" class="btn-royal-blue btn-full mt-2" [disabled]="loading || (submitted && successMessage)">
        <i class="bi bi-send-fill"></i>
        <span>{{ loading ? 'Sending...' : 'Send Reset Link' }}</span>
      </button>

      <div class="auth-footer-link">
        <a routerLink="/login" class="link-royal-blue">
          <i class="bi bi-arrow-left"></i> Return to Sign In
        </a>
      </div>
    </form>
  </div>
</div>
